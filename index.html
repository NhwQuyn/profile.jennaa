
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061326">
<meta name="description" content="Personal Website - Nguyen Le Thanh Loc">
<title>Nguyen Le Thanh Loc | Personal Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #030b18;
    color: #fff;
    overflow-x: hidden;
}

button {
    font-family: inherit;
    cursor: pointer;
}

/* WELCOME SCREEN */
#welcome-screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #030b18;
}

#welcome-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}

.welcome-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
        135deg,
        rgba(1,8,22,.65),
        rgba(0,20,48,.35),
        rgba(0,0,0,.65)
    );
}

.welcome-content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 520px;
    padding: 25px 18px;
    text-align: center;
    transform: translateY(50px);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 20px;
    background: rgba(5,15,32,.48);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 0 35px rgba(0,150,255,.15);
    animation: welcomeIn 1.2s ease both;
}

.avatar {
    display: block;
    width: 75px;
    height: 75px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(101,202,255,.65);
    opacity: 1;
    filter: none;
    box-shadow: 0 0 12px rgba(0,180,255,.2);
    margin: 0 auto 12px;
}

.welcome-title {
    font-size: clamp(12px, 3.8vw, 25px);
    white-space: nowrap;
    letter-spacing: .5px;
    color: #fff;
    text-shadow: 0 0 15px #159dff;
    margin-bottom: 12px;
}

.welcome-name {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: .5px;
    margin-bottom: 6px;
}

.welcome-subtitle {
    font-size: 12px;
    color: #a9dfff;
    margin-bottom: 12px;
}

.welcome-description {
    font-size: 12px;
    line-height: 1.5;
    color: rgba(255,255,255,.85);
    margin-bottom: 20px;
}

#enter-button {
    display: inline-block;
    padding: 11px 21px;
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 30px;
    background: linear-gradient(135deg,#0879db,#00b7ff);
    color: white;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 0 18px rgba(0,160,255,.35);
    transition: .3s;
}

#enter-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 25px rgba(0,180,255,.65);
}

.welcome-footer {
    margin-top: 20px;
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.65);
}

@keyframes welcomeIn {
    from {
        opacity: 0;
        transform: translateY(70px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(50px) scale(1);
    }
}

/* MUSIC POPUP */
#site-music-popup {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(0,5,16,.78);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.music-card {
    width: 100%;
    max-width: 360px;
    padding: 27px 19px;
    text-align: center;
    border: 1px solid rgba(73,183,255,.45);
    border-radius: 22px;
    background: linear-gradient(
        145deg,
        rgba(9,31,61,.98),
        rgba(3,12,29,.98)
    );
    box-shadow: 0 0 40px rgba(0,130,255,.2);
    animation: welcomeIn .6s ease both;
}

.music-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(77,190,255,.6);
    background: rgba(0,145,255,.13);
    font-size: 27px;
    color: #6ed3ff;
    animation: musicPulse 2s infinite;
}

.music-card h2 {
    font-size: 18px;
    margin-bottom: 12px;
    letter-spacing: .5px;
    text-shadow: 0 0 12px #168dff;
}

.music-card p {
    font-size: 12px;
    line-height: 1.7;
    color: rgba(255,255,255,.75);
    margin-bottom: 22px;
}

.music-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.music-actions button {
    width: 100%;
    padding: 12px;
    border-radius: 25px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: .5px;
    transition: .3s;
}

#site-music-yes {
    border: none;
    color: white;
    background: linear-gradient(135deg,#087bdf,#00baff);
    box-shadow: 0 0 15px rgba(0,160,255,.2);
}

#site-music-no {
    color: rgba(255,255,255,.85);
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.06);
}

.music-actions button:hover {
    transform: translateY(-2px);
}

.music-signature {
    margin-top: 22px;
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(130,200,255,.65);
}

@keyframes musicPulse {
    0%, 100% {
        box-shadow: 0 0 8px rgba(0,160,255,.2);
        transform: scale(1);
    }
    50% {
        box-shadow: 0 0 25px rgba(0,160,255,.5);
        transform: scale(1.06);
    }
}

/* MAIN WEBSITE */
#main-website {
    display: none;
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(
            rgba(2,8,20,.65),
            rgba(2,8,20,.78)
        ),
        url("https://cdn.upanhlaylink.com/i/KnhsX1eh.jpeg")
        center center / cover fixed no-repeat;
}

#main-website::before {
    content: "";
    position: fixed;
    inset: -30%;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(
            circle at 30% 40%,
            rgba(0,135,255,.15),
            transparent 35%
        ),
        radial-gradient(
            circle at 75% 70%,
            rgba(0,75,180,.16),
            transparent 40%
        );
    animation: lightMove 12s ease-in-out infinite alternate;
}

.website-content {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 30px 15px 90px;
}

@keyframes lightMove {
    from { transform: translate(-2%,-2%); }
    to { transform: translate(3%,3%); }
}

#main-website.show {
    animation: mainIn 1s ease both;
}

@keyframes mainIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* MUSIC BUTTON */
#music-button {
    display: none;
    position: fixed;
    z-index: 20;
    right: 17px;
    bottom: 20px;
    padding: 11px 16px;
    border: 1px solid rgba(100,200,255,.45);
    border-radius: 30px;
    color: white;
    font-size: 11px;
    font-weight: bold;
    background: rgba(4,31,62,.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 18px rgba(0,130,255,.2);
    transition: .3s;
}

#music-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 22px rgba(0,160,255,.45);
}

/* MOBILE */
@media(max-width:380px) {
    .welcome-content {
        padding: 22px 13px;
        transform: translateY(50px);
    }

    .avatar {
        width: 68px;
        height: 68px;
    }

    .welcome-title {
        font-size: 12px;
        letter-spacing: 0;
    }

    .welcome-name {
        font-size: 16px;
    }

    .welcome-subtitle,
    .welcome-description {
        font-size: 11px;
    }

    .welcome-footer {
        font-size: 8px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *,*::before,*::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<!-- NHẠC MỞ ĐẦU KHI TRUY CẬP LINK -->
<audio id="welcome-background-music"
       autoplay
       loop
       preload="auto"
       playsinline>
    <source src="https://files.catbox.moe/bhcgr8.mp3"
            type="audio/mpeg">
</audio>

<!-- NHẠC NỀN WEBSITE CHÍNH -->
<audio id="site-entry-audio" loop preload="none">
    <source src="https://files.catbox.moe/mowxk1.mp3"
            type="audio/mpeg">
</audio>

<!-- WELCOME SCREEN -->
<section id="welcome-screen">

    <video id="welcome-video"
           autoplay
           muted
           loop
           playsinline
           preload="auto">
        <source src="https://www.image2url.com/r2/default/videos/1795797257691-3ddd03d4-da01-49fd-a5df-c30228d30fc0.mp4"
                type="video/mp4">
    </video>

    <div class="welcome-overlay"></div>

    <div class="welcome-content">

        <img class="avatar"
             src="https://cdn.upanhlaylink.com/i/7KlbleXR.png"
             alt="Avatar Nguyen Le Thanh Loc">

        <h1 class="welcome-title">
            WELCOME TO MY WEBSITE
        </h1>

        <div class="welcome-name">
            Nguyen Le Thanh Loc
        </div>

        <div class="welcome-subtitle">
            Personal Website • TP. Huế
        </div>

        <p class="welcome-description">
            I know a little bit about information technology. 📌
        </p>

        <button id="enter-button">
            TRUY CẬP WEBSITE →
        </button>

        <div class="welcome-footer">
            WELCOME • EXPLORE • ENJOY
        </div>

    </div>
</section>

<!-- POPUP CHỌN NHẠC -->
<div id="site-music-popup">

    <div class="music-card">

        <div class="music-icon">♫</div>

        <h2>WELCOME TO MY WEBSITE</h2>

        <p>
            Bạn có muốn bật nhạc nền khi truy cập website không?
        </p>

        <div class="music-actions">

            <button id="site-music-yes">
                ♫ CÓ, BẬT NHẠC
            </button>

            <button id="site-music-no">
                KHÔNG, CẢM ƠN
            </button>

        </div>

        <div class="music-signature">
            NGUYEN LE THANH LOC
        </div>

    </div>
</div>

<!-- WEBSITE CHÍNH -->
<main id="main-website">

    <div class="website-content">
        <!-- Nội dung website mới sẽ được bổ sung tại đây -->
    </div>

</main>

<!-- NÚT BẬT TẮT NHẠC -->
<button id="music-button">
    ♫ BẬT NHẠC
</button>

<script>
const welcomeScreen = document.getElementById("welcome-screen");
const mainWebsite = document.getElementById("main-website");
const popup = document.getElementById("site-music-popup");

const welcomeMusic = document.getElementById("welcome-background-music");
const mainMusic = document.getElementById("site-entry-audio");
const welcomeVideo = document.getElementById("welcome-video");

const enterButton = document.getElementById("enter-button");
const yesButton = document.getElementById("site-music-yes");
const noButton = document.getElementById("site-music-no");
const musicButton = document.getElementById("music-button");

let enteredWebsite = false;

/* ÂM LƯỢNG 70% */
welcomeMusic.volume = 0.7;
welcomeMusic.loop = true;

mainMusic.volume = 0.7;
mainMusic.loop = true;

/* THỬ PHÁT NHẠC NGAY KHI MỞ LINK */
function startWelcomeMusic() {
    if (enteredWebsite) return;

    welcomeMusic.play().catch(() => {
        console.log("Trình duyệt yêu cầu thao tác để phát nhạc.");
    });
}

/* PHÁT THỬ NGAY KHI TRANG ĐƯỢC TẢI */
startWelcomeMusic();

/* THỬ LẠI KHI KHÁCH CHẠM MÀN HÌNH */
document.addEventListener("pointerdown", function retryWelcomeMusic() {
    if (!enteredWebsite && welcomeMusic.paused) {
        startWelcomeMusic();
    }
}, { once: true });

/* DỪNG NHẠC MỞ ĐẦU */
function stopWelcomeMusic() {
    welcomeMusic.pause();
    welcomeMusic.currentTime = 0;
}

/* CẬP NHẬT NÚT NHẠC */
function updateMusicButton() {
    musicButton.textContent = mainMusic.paused
        ? "♫ BẬT NHẠC"
        : "♫ TẮT NHẠC";
}

/* VÀO WEBSITE CHÍNH */
function openWebsite() {
    if (enteredWebsite) return;

    enteredWebsite = true;

    stopWelcomeMusic();

    welcomeScreen.style.display = "none";
    popup.style.display = "none";

    mainWebsite.style.display = "block";
    mainWebsite.classList.add("show");

    musicButton.style.display = "block";

    welcomeVideo.pause();

    updateMusicButton();
}

/* NHẤN TRUY CẬP WEBSITE */
enterButton.addEventListener("click", function() {
    stopWelcomeMusic();
    popup.style.display = "flex";
});

/* CHỌN CÓ - PHÁT NHẠC WEBSITE */
yesButton.addEventListener("click", async function() {
    stopWelcomeMusic();

    mainMusic.volume = 0.7;

    try {
        await mainMusic.play();
    } catch (error) {
        console.log("Không thể phát nhạc chính.");
    }

    openWebsite();
});

/* CHỌN KHÔNG - KHÔNG PHÁT NHẠC */
noButton.addEventListener("click", function() {
    stopWelcomeMusic();

    mainMusic.pause();
    mainMusic.currentTime = 0;

    openWebsite();
});

/* NÚT BẬT / TẮT NHẠC */
musicButton.addEventListener("click", async function() {

    if (mainMusic.paused) {
        mainMusic.volume = 0.7;

        try {
            await mainMusic.play();
        } catch (error) {
            console.log("Không thể phát nhạc.");
        }

    } else {
        mainMusic.pause();
    }

    updateMusicButton();
});

/* ĐỒNG BỘ TRẠNG THÁI */
mainMusic.addEventListener("play", updateMusicButton);
mainMusic.addEventListener("pause", updateMusicButton);

</script>

</body>
</html>
