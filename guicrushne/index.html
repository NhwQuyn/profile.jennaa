
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Particle Heart</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, cx, cy;
let particles = [];
let stars = [];

const COUNT = 2200;
const TAU = Math.PI * 2;

function resize() {
    W = canvas.width = innerWidth * devicePixelRatio;
    H = canvas.height = innerHeight * devicePixelRatio;

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    W = innerWidth;
    H = innerHeight;

    cx = W / 2;
    cy = H * 0.43;
}

addEventListener("resize", resize);
resize();

// Tạo hình trái tim
function heartPoint(t, scale) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t);

    return {
        x: x * scale,
        y: -y * scale
    };
}

// Vị trí ngẫu nhiên trong hình trái tim
function randomHeart() {
    const t = Math.random() * TAU;
    const r = Math.sqrt(Math.random());

    const p = heartPoint(t, Math.min(W,H) / 39);

    return {
        x: cx + p.x * r,
        y: cy + p.y * r
    };
}

// Tạo hạt
class Particle {
    constructor() {
        this.x = cx;
        this.y = cy;
        this.size = Math.random() * 1.8 + 0.4;
        this.speed = Math.random() * 0.025 + 0.008;
        this.alpha = Math.random();
        this.phase = Math.random() * TAU;
        this.scatterX = 0;
        this.scatterY = 0;
        this.setTarget();
    }

    setTarget() {
        const p = randomHeart();
        this.tx = p.x;
        this.ty = p.y;
    }

    update(time, scatter) {
        let targetX = this.tx;
        let targetY = this.ty;

        if (scatter > 0) {
            const angle = this.phase;
            const distance = scatter * (50 + Math.random() * 100);

            targetX += Math.cos(angle) * distance;
            targetY += Math.sin(angle) * distance;
        }

        this.x += (targetX - this.x) * this.speed;
        this.y += (targetY - this.y) * this.speed;

        this.alpha = 0.45 + 0.55 *
            Math.sin(time * 0.003 + this.phase) ** 2;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, TAU);

        ctx.fillStyle = `rgba(40,160,255,${this.alpha})`;

        ctx.shadowBlur = 9;
        ctx.shadowColor = "#008cff";

        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

// Sao nền
function createStars() {
    stars = [];

    for (let i = 0; i < 160; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 1.5,
            speed: Math.random() * 0.5 + 0.1,
            alpha: Math.random()
        });
    }
}

function drawStars(time) {
    stars.forEach(s => {
        s.y += s.speed;

        if (s.y > H) {
            s.y = 0;
            s.x = Math.random() * W;
        }

        const a = 0.2 + Math.abs(Math.sin(time * 0.001 + s.alpha)) * 0.6;

        ctx.fillStyle = `rgba(90,160,255,${a})`;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, TAU);
        ctx.fill();
    });
}

// Bệ năng lượng
function drawPlatform(time) {
    const y = cy + Math.min(W,H) * 0.38;
    const pulse = 1 + Math.sin(time * 0.004) * 0.05;

    ctx.save();

    ctx.translate(cx, y);
    ctx.scale(pulse, 1);

    // Ánh sáng nền
    let glow = ctx.createRadialGradient(0,0,2,0,0,75);

    glow.addColorStop(0,"rgba(0,190,255,0.8)");
    glow.addColorStop(0.4,"rgba(0,100,255,0.3)");
    glow.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle = glow;
    ctx.fillRect(-100,-55,200,110);

    // Vòng năng lượng
    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.ellipse(
            0,
            Math.sin(time * 0.003 + i) * 3,
            38 + i * 5,
            6 + i * 2,
            0, 0, TAU
        );

        ctx.strokeStyle = `rgba(0,170,255,${0.7-i*0.13})`;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00aaff";
        ctx.stroke();
    }

    ctx.restore();
    ctx.shadowBlur = 0;
}

// Tạo hiệu ứng tia sáng
function drawEnergy(time) {
    for (let i = 0; i < 15; i++) {
        const x = cx + Math.sin(time * 0.002 + i) * 65;
        const y = cy + 90 + Math.cos(time * 0.003 + i) * 25;

        ctx.beginPath();
        ctx.arc(x, y, Math.random() * 2, 0, TAU);

        ctx.fillStyle = "rgba(0,180,255,0.8)";
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#008cff";
        ctx.fill();
    }

    ctx.shadowBlur = 0;
}

// Khởi tạo
for (let i = 0; i < COUNT; i++) {
    particles.push(new Particle());
}

createStars();

// Chu kỳ tan biến và tái tạo
const cycle = 9000;

function animate(time) {
    ctx.clearRect(0, 0, W, H);

    drawStars(time);

    const progress = (time % cycle) / cycle;

    // Trái tim tan ra rồi tập hợp lại
    let scatter = 0;

    if (progress > 0.55 && progress < 0.78) {
        scatter = Math.sin(
            ((progress - 0.55) / 0.23) * Math.PI
        );
    }

    if (progress > 0.78) {
        scatter = 0;
    }

    // Cập nhật hạt
    particles.forEach(p => {
        p.update(time, scatter);
        p.draw();
    });

    drawEnergy(time);
    drawPlatform(time);

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>

</body>
</html>
