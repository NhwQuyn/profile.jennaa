
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffb6c9">
  <title>My Crush ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #ffe9f0, #ffc4d6);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #653348;
    }

    .music-control {
      position: fixed;
      top: 18px;
      right: 15px;
      z-index: 1000;
    }

    #musicBtn {
      border: none;
      border-radius: 30px;
      background: white;
      color: #e75480;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 15px #d77b9b55;
      cursor: pointer;
    }

    .content {
      width: min(90%, 500px);
      padding: 35px 22px;
      text-align: center;
      background: rgba(255,255,255,.8);
      border-radius: 25px;
      box-shadow: 0 10px 40px #bd668c35;
      z-index: 2;
      animation: appear 1s ease;
    }

    h2 {
      font-size: clamp(24px, 6vw, 34px);
      color: #e75480;
      margin-bottom: 20px;
    }

    h4 {
      font-size: 16px;
      line-height: 1.7;
      font-weight: normal;
      margin-bottom: 35px;
    }

    .buttons {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 65px;
    }

    .btn {
      border: none;
      border-radius: 30px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform .2s;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(.95);
    }

    #yes {
      color: white;
      background: #ff5c8a;
      box-shadow: 0 5px 15px #ff5c8a55;
      z-index: 2;
    }

    #no {
      color: white;
      background: #61aeea;
      position: relative;
      z-index: 3;
    }

    .heart {
      position: fixed;
      bottom: -30px;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 1;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success {
      position: fixed;
      inset: 0;
      background: #00000088;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
    }

    .success-box {
      background: white;
      width: min(100%, 380px);
      padding: 35px 25px;
      border-radius: 25px;
      text-align: center;
      animation: appear .5s ease;
    }

    .success-box h2 {
      margin-bottom: 15px;
    }

    .success-box p {
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .close-btn {
      border: none;
      border-radius: 25px;
      padding: 12px 25px;
      background: #ff5c8a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    @media(max-width: 400px) {
      .content {
        padding: 30px 15px;
      }

      .btn {
        padding: 12px 14px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- NÚT NHẠC -->
  <div class="music-control">
    <button id="musicBtn">🎵 Bật nhạc</button>
  </div>

  <!-- NHẠC NỀN -->
  <audio id="backgroundMusic" loop preload="none">
    <source src="sound/vol1.mp3" type="audio/mpeg">
  </audio>

  <!-- NỘI DUNG -->
  <main class="content">

    <h2 id="text3">
      Cậu yêu tớ có phải không nào? ❤️
    </h2>

    <h4 id="text4">
      Nếu cậu không trả lời mà thoát ra
      tức là muốn làm vợ tớ rồi đó nha :v
    </h4>

    <div class="buttons" id="buttonArea">

      <button id="yes" class="btn">
        Yêu ơi là yêuuuuuu ❤️
      </button>

      <button id="no" class="btn">
        Cậu mơ à :333
      </button>

    </div>

  </main>

  <!-- THÔNG BÁO YES -->
  <div class="success" id="success">
    <div class="success-box">

      <h2>Yêu rồi nhé! ❤️</h2>

      <p>
        Tớ biết mà! 🥰<br>
        Cảm ơn cậu đã đồng ý.<br>
        Từ nay phải luôn vui vẻ nhé!
      </p>

      <button class="close-btn" id="closeBtn">
        Đóng ❤️
      </button>

    </div>
  </div>

  <script>
    const music = document.getElementById("backgroundMusic");
    const musicBtn = document.getElementById("musicBtn");

    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");

    const success = document.getElementById("success");
    const closeBtn = document.getElementById("closeBtn");
    const buttonArea = document.getElementById("buttonArea");

    let musicPlaying = false;

    // BẬT / TẮT NHẠC
    musicBtn.addEventListener("click", async () => {
      if (!musicPlaying) {
        try {
          await music.play();
          musicPlaying = true;
          musicBtn.textContent = "🔊 Tắt nhạc";
        } catch (error) {
          musicBtn.textContent = "⚠️ Không phát được nhạc";
          console.error("Lỗi âm thanh:", error);
        }
      } else {
        music.pause();
        musicPlaying = false;
        musicBtn.textContent = "🎵 Bật nhạc";
      }
    });

    // NÚT YES
    yesBtn.addEventListener("click", () => {
      success.style.display = "flex";
      createHearts(25);
    });

    // NÚT NO CHẠY TRỐN
    function moveNoButton() {
      const area = buttonArea.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();

      const maxX = Math.max(0, area.width - btn.width);
      const maxY = 110;

      const x = Math.random() * maxX;
      const y = (Math.random() - 0.5) * maxY;

      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top = "50%";
      noBtn.style.transform =
        "translateY(-50%) translateY(" + y + "px)";
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", (event) => {
      event.preventDefault();
      moveNoButton();
    }, { passive: false });

    noBtn.addEventListener("click", moveNoButton);

    // ĐÓNG THÔNG BÁO
    closeBtn.addEventListener("click", () => {
      success.style.display = "none";
    });

    // HIỆU ỨNG TIM BAY
    function createHearts(amount = 1) {
      for (let i = 0; i < amount; i++) {
        const heart = document.createElement("div");

        heart.className = "heart";
        heart.textContent = ["❤️", "💗", "💕", "💖"][
          Math.floor(Math.random() * 4)
        ];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (15 + Math.random() * 25) + "px";
        heart.style.animationDuration = (3 + Math.random() * 4) + "s";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 7500);
      }
    }

    // TIM BAY LIÊN TỤC
    setInterval(() => {
      createHearts(2);
    }, 700);

  </script>

</body>
</html>
